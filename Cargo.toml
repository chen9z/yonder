[workspace]
members = ["crates/*"]
exclude = ["app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
herdc-wire = { path = "crates/herdc-wire" }
herdc-model = { path = "crates/herdc-model" }
herdc-ssh = { path = "crates/herdc-ssh" }
herdc-term = { path = "crates/herdc-term" }
herdc-engine = { path = "crates/herdc-engine" }
herdc-testkit = { path = "crates/herdc-testkit" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time", "process", "net"] }
tracing = "0.1"

# No debug info in tests and clippy builds: on macOS it stays in object
# files beside them, a new set each incremental build, never cleaned
# (tens of GB in days). Panics still say where; backtraces have no lines.
[profile.dev]
debug = false
