[package]
name = "herdc-ssh"
description = "SSH to the computer running Herdr, and a pipe to its herdr-core"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
herdc-wire.workspace = true
rand = "0.10"
# No "rsa": russh pins an rsa release candidate the NSH runtime can't share.
# Keys are ed25519 (the phone's own), host keys ed25519 or ECDSA.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
herdc-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
