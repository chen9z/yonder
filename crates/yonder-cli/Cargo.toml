[package]
name = "yonder-cli"
description = "The yonder command (a task list and reminders in Yonder's ledger) and yonderd, which fires the reminders"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "yonder"
path = "src/bin/yonder.rs"

[[bin]]
name = "yonderd"
path = "src/bin/yonderd.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
yonder-core.workspace = true
yonder-model.workspace = true
