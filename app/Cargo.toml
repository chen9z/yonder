[package]
name = "herdc-app"
description = "Herdr on the phone: the app's UI, on NSH"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
log = "0.4"
herdc-engine = { path = "../crates/herdc-engine" }
herdc-model = { path = "../crates/herdc-model" }
herdc-ssh = { path = "../crates/herdc-ssh" }
herdc-term = { path = "../crates/herdc-term" }
herdc-wire = { path = "../crates/herdc-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }


ring = "0.17"

[features]
# Passwords kept as they are, for the headless tests (tests/app.rs): they
# never reach the keychain. A release build with it does not compile.
plain-vault = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
herdc-app = { path = ".", features = ["plain-vault"] }
herdc-testkit = { path = "../crates/herdc-testkit" }
nsh-engine = "0.4.0"
nsh-testing = { version = "0.4.0", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# No debug info in tests and clippy builds: on macOS it stays in object
# files beside them, a new set each incremental build, never cleaned
# (tens of GB in days). Panics still say where; backtraces have no lines.
[profile.dev]
debug = false
