[package]
name = "herdc-app"
description = "Herdr on the phone: the app's UI, on NSH"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
log = "0.4"
herdc-engine = { path = "../crates/herdc-engine" }
herdc-model = { path = "../crates/herdc-model" }
herdc-ssh = { path = "../crates/herdc-ssh" }
herdc-term = { path = "../crates/herdc-term" }
herdc-wire = { path = "../crates/herdc-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }


ring = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[dev-dependencies]
herdc-testkit = { path = "../crates/herdc-testkit" }
nsh-engine = "0.4.0"
nsh-testing = { version = "0.4.0", default-features = false }
